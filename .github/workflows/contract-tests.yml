name: API Contract Tests

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "HTTPS deployment origin (or loopback HTTP); administrative checks are disabled"
        required: true
        type: string
      confirm_live_writes:
        description: "I understand this check writes synthetic sessions to the target deployment"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: ${{ inputs.confirm_live_writes }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Run contract checks once
        env:
          DELX_ALLOW_LIVE_CONTRACT_WRITES: "1"
          PROTOCOL_ADMIN_PIN: "" # Variable targets must never receive an administrative credential.
          TARGET_BASE_URL: ${{ inputs.base_url }}
        run: |
          set -euo pipefail
          # Contract mode creates/rotates identities and sessions. An uncertain
          # failure must be inspected, never replayed automatically.
          python delx-mcp-server/scripts/api_monitor.py --mode contract --base "$TARGET_BASE_URL"
